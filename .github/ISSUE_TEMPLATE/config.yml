blank_issues_enabled: false

contact_links:
  - name: 🔐 Report a security vulnerability
    url: https://github.com/libxa-framework/libxa/security/advisories/new
    about: >
      Never report a vulnerability in a public issue. Use this private
      advisory form, or email libxa@vyloxi.com with subject [SECURITY].

  - name: 💬 Question or help with your own code
    url: https://github.com/libxa-framework/libxa/discussions
    about: >
      "How do I ...?" belongs in Discussions. The issue tracker is for
      confirmed framework defects and feature proposals.

  - name: 📦 Starter kit issues
    url: https://github.com/libxa-framework/LibxaStack/issues
    about: >
      For problems with the application skeleton: scaffolding, default
      config, the example controllers: rather than the framework itself.

  - name: 📖 Contributing guide
    url: https://github.com/libxa-framework/libxa/blob/main/CONTRIBUTING.md
    about: Local setup, branch model, coding standards, and how to open a PR.
